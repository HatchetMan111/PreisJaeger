<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PreisJäger – lokale Preisrecherche</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>PreisJäger</h1>
  <p class="sub">Lokale Preisrecherche · Preissieger · Verlauf · Bestpreis</p>
  <nav>
    <button id="tab-search" class="active">Suche</button>
    <button id="tab-history">Verlauf</button>
    <button id="tab-settings">Einstellungen</button>
  </nav>
</header>

<main>
<section id="view-search">
  <form id="search-form">
    <input id="q" type="text" placeholder="z. B. Ubiquiti UXG-Lite" autocomplete="off" required>
    <button type="submit">Suchen</button>
  </form>
  <div id="status"></div>
  <div id="summary" class="hidden"></div>
  <div id="winner" class="hidden"></div>
  <div id="results"></div>
</section>

<section id="view-history" class="hidden">
  <div class="row">
    <input id="hq" type="text" placeholder="Verlauf filtern …">
    <button id="hsearch">Filtern</button>
    <a href="/api/history/export?format=csv" class="btn">CSV</a>
    <a href="/api/history/export?format=json" class="btn">JSON</a>
  </div>
  <table>
    <thead><tr><th>Datum</th><th>Anfrage</th><th>Gewinner</th><th>Preis</th><th>Quelle</th><th>Dauer</th></tr></thead>
    <tbody id="history-body"></tbody>
  </table>
  <div id="detail" class="hidden"></div>
</section>

<section id="view-settings" class="hidden">
  <div class="card">
    <h3>LLM (optional)</h3>
    <label>Provider
      <select id="s-provider">
        <option value="none">Kein LLM – lokal &amp; kostenlos (Standard)</option>
        <option value="openrouter">OpenRouter (Key nötig)</option>
      </select>
    </label>
    <label>OpenRouter API-Key
      <input id="s-or-key" type="password" placeholder="sk-or-…" autocomplete="off">
    </label>
    <div class="mut" id="s-or-hint"></div>
    <label>Modell <input id="s-or-model" type="text" placeholder="openai/gpt-4o-mini"></label>
    <div class="row">
      <button id="s-save-llm">Speichern</button>
      <button id="s-test-llm">Key testen</button>
    </div>
    <div id="s-llm-status" class="mut"></div>
  </div>
  <div class="card">
    <h3>Shops</h3>
    <div id="s-shops" class="mut">Lade …</div>
    <label>Timeout pro Suche (ms) <input id="s-timeout" type="number" min="10000" max="120000" step="5000"></label>
    <button id="s-save-shops">Speichern</button>
    <div class="mut">Nichts angehakt = EU-Standardauswahl.</div>
  </div>
  <div class="card">
    <h3>Fallback (optional)</h3>
    <label><input id="s-fb" type="checkbox"> Brave-Fallback bei 0 Shop-Treffern</label>
    <label>Brave API-Key
      <input id="s-brave-key" type="password" placeholder="BSA…" autocomplete="off">
    </label>
    <div class="mut" id="s-brave-hint"></div>
    <button id="s-save-fb">Speichern</button>
  </div>
</section>
</main>

<script src="app.js"></script>
</body>
</html>
